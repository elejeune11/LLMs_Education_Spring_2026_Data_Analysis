[project]
name = "ek301-genai-study-2026"
version = "1.0.0"
description = "Analysis code and figure pipeline for the EK301 Spring 2026 generative AI study"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "engineering education",
    "engineering mechanics",
    "statics",
    "generative AI",
    "large language models",
    "qualitative coding",
]

authors = [
    { name = "Emma Lejeune", email = "elejeune@bu.edu" },
    # TODO: add remaining authors to match the manuscript author list
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Figures and data analysis. Floors reflect the oldest release each module's
# API usage is known to work with; see requirements.txt for the exact versions
# the published figures were generated under.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed only to re-run the LLM qualitative coding pipeline
# (run_llm_coding.py, adjudicate_llm.py). Not needed to regenerate figures.
coding = [
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
]
# Needed only to read the superseded .xlsx versions of the data files.
legacy-excel = [
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/TODO/TODO"
Dataset = "https://open.bu.edu/TODO"
Preprint = "https://arxiv.org/abs/TODO"

# ── Note on Python version ────────────────────────────────────────────────────
# requires-python = ">=3.10" is a hard floor, not a preference. The modules use
# PEP 604 union annotations (`str | None`), which are evaluated at function
# definition time and raise TypeError on 3.9 and earlier. The README setup
# instructions create a 3.12 environment.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat collection of analysis scripts rather than an installable package.
py-modules = []
